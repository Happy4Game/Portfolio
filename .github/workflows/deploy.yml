# Construit le site avec Astro et le publie sur GitHub Pages à chaque push sur master.
# Modèle officiel : https://docs.astro.build/en/guides/deploy/github/
name: Déployer sur GitHub Pages

on:
  push:
    branches: [master]
  # Permet de relancer le déploiement à la main depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer, construire et préparer le site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
